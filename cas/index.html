<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>CAS Calculator</title>

  <!-- Apply the shared CalQ theme before stylesheets load -->
  <script src="../theme.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.9/dist/katex.min.css">
  <link rel="stylesheet" href="src/css/theme.css">
  <link rel="stylesheet" href="src/css/layout.css">
  <link rel="stylesheet" href="src/css/components.css">
</head>

<body>
  <div id="menuBackdrop" class="menu-backdrop"></div>

  <header class="app-bar">
    <div class="app-title">CAS</div>
    <button
      id="menuToggle"
      class="menu-toggle"
      type="button"
      aria-label="Open settings"
      aria-expanded="false"
    >≡</button>
  </header>

  <aside id="sideMenu" class="side-menu" aria-hidden="true">
    <div class="menu-title">Menu</div>

    <section class="menu-section" id="displaySection">
      <button
        class="menu-section-toggle"
        type="button"
        aria-expanded="false"
      >
        <span>Settings</span>
        <span class="section-arrow">∨</span>
      </button>

      <div class="settings-content" hidden>
        <div class="setting-row">
          <span class="setting-name">Theme</span>

          <div class="display-options">
            <button
              class="display-option"
              data-theme-choice="light"
              type="button"
              aria-label="Light theme"
              aria-pressed="false"
            >L</button>

            <button
              class="display-option"
              data-theme-choice="dark"
              type="button"
              aria-label="Dark theme"
              aria-pressed="false"
            >D</button>

            <button
              class="display-option"
              data-theme-choice="auto"
              type="button"
              aria-label="Automatic theme"
              aria-pressed="false"
            >Auto</button>
          </div>
        </div>
      </div>
    </section>

    <section class="menu-section commands-section" id="commandsSection">
      <button
        class="menu-section-toggle"
        type="button"
        aria-expanded="false"
      >
        <span>Commands</span>
        <span class="section-arrow">∨</span>
      </button>

      <div class="commands-content" hidden>
        <div id="settingsCommandList" class="command-list"></div>
      </div>
    </section>

    <div class="menu-footer">Developed by Jay-R C. Maguad</div>
  </aside>

  <main class="app-shell">
    <section id="containers" class="containers"></section>
  </main>

  <div
    id="casCommandPalette"
    class="cas-command-palette"
    role="dialog"
    aria-label="CAS commands"
    aria-hidden="true"
  >
    <div class="cas-command-head">
      <span>CAS Commands</span>
    </div>
    <div id="casCommandPaletteList" class="cas-command-list"></div>
  </div>

  <div id="matrixModal" class="matrix-modal" aria-hidden="true">
    <div
      class="matrix-modal-panel"
      role="dialog"
      aria-modal="true"
      aria-label="Matrix result"
    >
      <div class="matrix-modal-head">
        <span id="matrixModalTitle" class="matrix-modal-title">Matrix</span>
        <button id="matrixModalClose" type="button" aria-label="Close">×</button>
      </div>
      <div id="matrixModalBody" class="matrix-modal-body"></div>
    </div>
  </div>

  <div id="chemistryModal" class="matrix-modal" aria-hidden="true">
    <div
      class="matrix-modal-panel chemistry-modal-panel"
      role="dialog"
      aria-modal="true"
      aria-label="Chemical balancing process"
    >
      <div class="matrix-modal-head">
        <span id="chemistryModalTitle" class="matrix-modal-title">Balancing</span>
        <button id="chemistryModalClose" type="button" aria-label="Close">×</button>
      </div>
      <div id="chemistryModalBody" class="matrix-modal-body chemistry-modal-body"></div>
    </div>
  </div>

  <!-- Theme selector synchronization -->
  <script>
    (() => {
      const KEY = "calq-display-mode";
      const buttons = document.querySelectorAll("[data-theme-choice]");

      function readMode() {
        try {
          const mode = localStorage.getItem(KEY);
          return ["light", "dark", "auto"].includes(mode)
            ? mode
            : "auto";
        } catch {
          return "auto";
        }
      }

      function updateButtons() {
        const mode = readMode();

        buttons.forEach(button => {
          const selected = button.dataset.themeChoice === mode;

          button.classList.toggle("active", selected);
          button.setAttribute("aria-pressed", String(selected));
        });
      }

      buttons.forEach(button => {
        button.addEventListener("click", () => {
          const mode = button.dataset.themeChoice;

          if (typeof window.setCalQTheme === "function") {
            window.setCalQTheme(mode);
          } else {
            try {
              localStorage.setItem(KEY, mode);
              location.reload();
            } catch {
              console.error("Unable to save the CalQ theme preference.");
            }
          }

          updateButtons();
        });
      });

      window.addEventListener("calq-theme-change", updateButtons);

      window.addEventListener("storage", event => {
        if (event.key === KEY) updateButtons();
      });

      updateButtons();
    })();
  </script>

  <!-- CAS dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.18.9/dist/katex.min.js"></script>

  <!-- CAS application scripts -->
  <script src="src/js/logarithmic-engine.js"></script>
  <script src="src/js/cas-engine.js"></script>
  <script src="src/js/katex-renderer.js"></script>
  <script src="src/js/app.js"></script>
</body>
</html>
